<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="bgPlate" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FDFBF7" />
      <stop offset="100%" stop-color="#F1EAE0" />
    </radialGradient>
  </defs>
  <rect width="600" height="600" rx="36" fill="url(#bgPlate)" />

  <!-- Subtle Ceramic Plate Ring -->
  <circle cx="300" cy="275" r="158" fill="#FAF6F0" stroke="#DDD1C0" stroke-width="3" />
  <circle cx="300" cy="275" r="118" fill="none" stroke="#E5DACB" stroke-width="2" stroke-dasharray="6 8" />

  <!-- Minimalist Cloche / Dish Icon -->
  <path
    d="M210 302 C210 248, 250 212, 300 212 C350 212, 390 248, 390 302 Z"
    fill="none"
    stroke="#9A8373"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="300" cy="198" r="10" fill="none" stroke="#9A8373" stroke-width="6" />
  <line x1="192" y1="302" x2="408" y2="302" stroke="#9A8373" stroke-width="6" stroke-linecap="round" />

  <!-- Utensils Accent -->
  <path d="M266 322 L334 322" stroke="#C5B29E" stroke-width="4" stroke-linecap="round" />

  <!-- Subtle Label -->
  <text
    x="300"
