services:
  postgres:
    image: postgres:16-alpine
    container_name: dishora-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: dishora
    ports:
      - "5432:5432"
    volumes:
      - dishora_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: dishora-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - dishora_redisdata:/data

volumes:
  dishora_pgdata:
  dishora_redisdata:
